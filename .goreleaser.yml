version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: paracell
    main: ./cmd/paracell
    binary: paracell
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: paracell
    formats:
      - tar.gz
    name_template: >-
      {{ .Binary }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

release:
  draft: true
