version: 2

project_name: paracell

before:
  hooks:
    - go mod tidy

builds:
  - id: paracell
    main: ./cmd/paracell
    binary: paracell
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/hgsg11/paracell/internal/app.Version={{.Version}}
      - -X github.com/hgsg11/paracell/internal/app.Commit={{.Commit}}
      - -X github.com/hgsg11/paracell/internal/app.BuildDate={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: paracell
    formats:
      - tar.gz
    name_template: >-
      {{ .Binary }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: paracell
    ids:
      - paracell
    binaries:
      - paracell
    homepage: https://github.com/hgsg11/paradev
    description: Create isolated per-issue development cells from a project repo
    commit_msg_template: "Cask update for {{ .ProjectName }} version {{ .Tag }}"
    repository:
      owner: hgsg11
      name: homebrew-paracell
      branch: main
      git:
        url: ssh://git@github.com/hgsg11/homebrew-paracell.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    commit_author:
      name: goreleaserbot
      email: bot@hgsg11.dev
