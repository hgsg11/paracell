name: usecase-test-review
description: use case tests only. Generate tests and review them. Stop before implementation.
workflow_config:
  provider_options:
    codex:
      network_access: true
max_steps: 12
initial_step: write-tests

loop_monitors:
  - cycle: [ai-antipattern-review-1st, ai-antipattern-fix]
    threshold: 3
    judge:
      persona: supervisor
      edit: false
      instruction: |
        AI 特有の問題のレビュー/修正ループが継続しています。

        以下を評価してください:
        - 実際に改善しているか
        - レビュー指摘が発散していないか
        - scope が大きすぎないか
        - user intervention が必要か

        次を判定してください:
        - Progress acceptable
        - Scope reduction needed
        - Architecture deadlock
      rules:
        - condition: Progress acceptable
          next: ai-antipattern-review-1st
        - condition: Scope reduction needed
          next: review-tests
        - condition: Architecture deadlock
          next: review-tests
  - cycle:
      - review-tests
      - write-tests
    threshold: 3
    judge:
      persona: supervisor
      edit: false
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（指摘数が減少、修正が反映されている）
          next: review-tests
        - condition: 非生産的（同じ指摘が繰り返される）
          next: ABORT

steps:
  - name: write-tests
    persona: coder
    model: gpt-5.4-mini
    policy:
      - coding
      - testing
    knowledge:
      - architecture
    edit: true
    required_permission_mode: edit
    instruction: |
      {task}

      use case 層のテストのみ作成してください。
      実装コードは変更しないでください。
      repository/mock/fake はテストに必要な範囲のみ作成してください。
      domain / infrastructure / handler のテストは作成しないでください。
      テストは現時点で失敗しても構いません。
    rules:
      - condition: Tests written
        next: ai-antipattern-review-1st
      - condition: Cannot proceed
        next: ABORT

  - name: ai-antipattern-review-1st
    edit: false
    persona: ai-antipattern-reviewer
    model: gpt-5.4-mini
    policy:
      - review
      - ai-antipattern
    instruction: ai-antipattern-review
    rules:
      - condition: AI特有の問題が見つからない
        next: review-tests
      - condition: AI特有の問題が検出された
        next: ai-antipattern-fix
    output_contracts:
      report:
        - name: ai-antipattern-review.md
          format: ai-antipattern-review

  - name: ai-antipattern-fix
    edit: true
    persona: coder
    model: gpt-5.4-mini
    policy:
      - coding
      - testing
    session: refresh
    knowledge:
      - architecture
      - unit-testing
    required_permission_mode: edit
    instruction: ai-antipattern-fix
    pass_previous_response: false
    rules:
      - condition: AI Reviewerの指摘に対する修正が完了した
        next: ai-antipattern-review-1st
      - condition: 修正不要（指摘対象ファイル/仕様の確認済み）
        next: review-tests
      - condition: 修正を進行できない
        next: review-tests

  - name: review-tests
    persona: architecture-reviewer
    model: gpt-5.5
    knowledge:
      - architecture
    edit: false
    required_permission_mode: readonly
    rules:
      - condition: Test review approved
        next: COMPLETE
      - condition: Tests need fix
        next: write-tests
      - condition: Cannot proceed
        next: ABORT
    instruction: |
      作成された use case テストをレビューしてください。

      観点:
      - use case の振る舞いを検証しているか
      - 実装詳細に依存しすぎていないか
      - DDD / Clean Architecture の依存方向を壊していないか
      - mock/fake が過剰でないか
      - repository interface 境界が自然か
      - テスト名が仕様として読めるか

      実装コードは変更しないでください。
      承認可能なら Test review approved。
      修正が必要なら Tests need fix。
