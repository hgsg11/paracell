project:
    name: "paracell"
providers:
    source: git
    workspace: tmux
    notifications: tmux
templates:
    feat:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: takt
                      command: 'codex "{{.Command}}"'
            targets:
                repository:
                    source:
                        branchPrefix: feat/
                        base: origin/main
    fix:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: takt
                      command: 'codex "{{.Command}}"'
            targets:
                repository:
                    source:
                        branchPrefix: fix/
                        base: origin/main
