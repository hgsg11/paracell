project:
    name: "paracell"
providers:
    source: git
    workspace: tmux
    notifications: tmux
prefixes:
    feat: feat/
    fix: fix/
templates:
    feat:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: takt
                      command: 'codex "{{.Command}}"'
        targets:
            repository:
                source:
                    base: origin/main
    fix:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: takt
                      command: 'codex "{{.Command}}"'
        targets:
            repository:
                source:
                    base: origin/main
