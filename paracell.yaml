project:
    name: "paracell"
providers:
    source: git
    container: none
    workspace: tmux
    notifications: tmux
prefixes:
    feat: feat/
    fix: fix/
    update: update/
templates:
    self:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: agent
                      command: |-
                        { code-review-graph build --repo . || true; } && PARACELL_PROMPT="$(cat <<'PARACELL_EOF'
                        {{.Command}}
                        PARACELL_EOF
                        )" nvim -c "lua require('aibo.command.aibo').call(vim.list_extend({'claude','--model','opus'}, vim.env.PARACELL_PROMPT ~= '' and {vim.env.PARACELL_PROMPT} or {}), {opener='edit'})"
        targets:
            repository:
                source:
                    path: .
                    base: origin/main
    requirements:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: agent
                      command: |-
                        { code-review-graph build --repo . || true; } && PARACELL_PROMPT="$(cat <<'PARACELL_EOF'
                        {{.Command}}
                        PARACELL_EOF
                        )" nvim -c "lua require('aibo.command.aibo').call(vim.list_extend({'claude','--model','opus'}, vim.env.PARACELL_PROMPT ~= '' and {vim.env.PARACELL_PROMPT} or {}), {opener='edit'})"
