project:
    name: ""
providers:
    source: git
    container: none
    workspace: tmux
    notifications: tmux
prefixes:
    feat: feat/
    fix: fix/
templates:
    feat:
        commanderCell:
            name: workspace
            workspace:
                windows: []
        targets:
            repository:
                source:
                    path: .
                    base: main
    fix:
        commanderCell:
            name: workspace
            workspace:
                windows: []
        targets:
            repository:
                source:
                    path: .
                    base: main
    review:
        commanderCell:
            name: workspace
            workspace:
                windows: []
        targets:
            repository:
                source:
                    path: .
                    base: main
    update:
        commanderCell:
            name: workspace
            workspace:
                windows: []
        targets:
            repository:
                source:
                    path: .
                    base: main
