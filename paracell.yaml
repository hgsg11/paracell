project:
    name: ""
providers:
    source: git
    container: none
    workspace: tmux
    notifications: tmux
prefixes:
    feat: feat/
    fix: fix/
templates:
    base:
        abstract: true
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: claude
                      command: |-
                        cd repository/source && { code-review-graph build --repo . || true; } && claude{{if .Command}} "$(cat <<'PARACELL_EOF'
                        {{.Command}}
                        PARACELL_EOF
                        )"{{end}}
        targets:
            repository:
                source:
                    path: .
                    base: main
    feat:
        extends: base
    fix:
        extends: base
    review:
        extends: base
    update:
        extends: base
