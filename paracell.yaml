project:
    name: ""
providers:
    source: git
    container: none
    workspace: tmux
    notifications: tmux
prefixes:
    feat: feat/
    fix: fix/
templates:
    feat:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: claude
                      command: |-
                        cd repository/source && { code-review-graph build --repo . || true; } && PARACELL_PROMPT="$(cat <<'PARACELL_EOF'
                        {{.Command}}
                        PARACELL_EOF
                        )" nvim -c "lua require('aibo.command.aibo').call(vim.list_extend({'claude','--model','opus'}, vim.env.PARACELL_PROMPT ~= '' and {vim.env.PARACELL_PROMPT} or {}), {opener='edit'})"
        targets:
            repository:
                source:
                    path: .
                    base: main
    fix:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: claude
                      command: |-
                        cd repository/source && { code-review-graph build --repo . || true; } && PARACELL_PROMPT="$(cat <<'PARACELL_EOF'
                        {{.Command}}
                        PARACELL_EOF
                        )" nvim -c "lua require('aibo.command.aibo').call(vim.list_extend({'claude','--model','opus'}, vim.env.PARACELL_PROMPT ~= '' and {vim.env.PARACELL_PROMPT} or {}), {opener='edit'})"
        targets:
            repository:
                source:
                    path: .
                    base: main
    refinement:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: claude
                      command: |-
                        mkdir -p .paracell/refinements/{{.Name}} && PARACELL_PROMPT="$(cat <<'PARACELL_EOF'
                        {{.Command}}
                        PARACELL_EOF
                        )" nvim -c "lua require('aibo.command.aibo').call(vim.list_extend({'claude','--model','opus','--append-system-prompt','This is a paracell refinement cell. Do not modify, create, or delete files in the repository. Write mocks, notes, and other outputs only under .paracell/refinements/{{.Name}}/.'}, vim.env.PARACELL_PROMPT ~= '' and {vim.env.PARACELL_PROMPT} or {}), {opener='edit'})"
    review:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: claude
                      command: |-
                        cd repository/source && { code-review-graph build --repo . || true; } && PARACELL_PROMPT="$(cat <<'PARACELL_EOF'
                        {{.Command}}
                        PARACELL_EOF
                        )" nvim -c "lua require('aibo.command.aibo').call(vim.list_extend({'claude','--model','opus'}, vim.env.PARACELL_PROMPT ~= '' and {vim.env.PARACELL_PROMPT} or {}), {opener='edit'})"
        targets:
            repository:
                source:
                    path: .
                    base: main
    update:
        commanderCell:
            name: workspace
            workspace:
                windows:
                    - name: claude
                      command: |-
                        cd repository/source && { code-review-graph build --repo . || true; } && PARACELL_PROMPT="$(cat <<'PARACELL_EOF'
                        {{.Command}}
                        PARACELL_EOF
                        )" nvim -c "lua require('aibo.command.aibo').call(vim.list_extend({'claude','--model','opus'}, vim.env.PARACELL_PROMPT ~= '' and {vim.env.PARACELL_PROMPT} or {}), {opener='edit'})"
        targets:
            repository:
                source:
                    path: .
                    base: main
