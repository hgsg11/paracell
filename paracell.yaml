project:
    name: "paracell"
providers:
    source: git
    session: tmux
    notifications: tmux
templates:
    feat:
        repository:
            branchPrefix: feat/
            base: origin/main
        containers:
            services: {}
        session:
            windows:
                - name: takt
                  command: 'codex "{{.Command}}"'
    fix:
        repository:
            branchPrefix: fix/
            base: origin/main
        containers:
            services: {}
        session:
            windows:
                - name: takt
                  command: 'codex "{{.Command}}"'
